[project]
name = "paitryk-backend"
version = "0.1.0"
description = "PAItryk — AI clone backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "ollama>=0.4",
    "anthropic>=0.40",
    "qdrant-client>=1.12",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "python-multipart>=0.0.27",
    "python-docx>=1.2.0",
    "openai>=2.35.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ipython>=8.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
